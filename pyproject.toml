[project]
name = "jev-harness-poc"
version = "0.1.0"
description = "POC: an agent harness that uses a Jev (System One) classifier for model routing and tool-risk gating"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jev = ["langchain-typesafe"]
langchain = ["langchain-typesafe[experimental]"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
